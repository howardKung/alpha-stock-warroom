name: Intraday 20-Min Live Trading & Actionable Buy/Sell Radar

on:
  schedule:
    # === 台股開市每 20 分鐘盯盤撮合＆買賣建議（週一至週五 09:00 ~ 13:20 台灣時間 = 01:00 ~ 05:20 UTC）===
    - cron: '0,20,40 1-4 * * 1-5'
    - cron: '0,20 5 * * 1-5'

    # === 美股開市每 20 分鐘盯盤撮合＆買賣建議（台灣時間深夜 21:40 ~ 清晨 04:40 = 13:40 ~ 20:40 UTC）===
    - cron: '40 13 * * 1-5'
    - cron: '0,20,40 14-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  intraday-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run 20-min live trading & actionable Boss buy/sell advisor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/intraday_advisor.py

      - name: Commit live portfolio.json & intraday_pulse.json
        run: |
          git config user.name "Alpha 20m Intraday Bot"
          git config user.email "alpha-intraday@project-lifeblood.local"
          git add portfolio.json intraday_pulse.json
          if ! git diff --cached --quiet; then
            git commit -m "⚡ 20m intraday radar & order match $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M TWT')"
            git pull --rebase -X ours origin main
            git push origin main
          fi
