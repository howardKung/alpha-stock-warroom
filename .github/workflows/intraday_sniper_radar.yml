name: Intraday 20-Min Live Trading & Actionable Buy/Sell Radar

on:
  schedule:
    # === 台股開市每 20 分鐘備援排程（避開整點擁塞，週一至週五 09:02 ~ 13:22 台灣時間）===
    - cron: '2,22,42 1-4 * * 1-5'
    - cron: '2,22 5 * * 1-5'

    # === 美股開市每 20 分鐘備援排程（避開整點擁塞，台灣時間深夜 21:42 ~ 清晨 04:42）===
    - cron: '42 13 * * 1-5'
    - cron: '2,22,42 14-20 * * 1-5'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Trigger source (manual or auto_20m)'
        required: false
        default: 'manual'

permissions:
  contents: write

jobs:
  intraday-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run 20-min live trading & actionable Boss buy/sell advisor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
        run: python3 scripts/intraday_advisor.py

      - name: Commit live portfolio.json & intraday_pulse.json
        run: |
          git config user.name "Alpha 20m Intraday Bot"
          git config user.email "alpha-intraday@project-lifeblood.local"
          git add portfolio.json intraday_pulse.json
          if ! git diff --cached --quiet; then
            git commit -m "⚡ 20m intraday radar & order match $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M TWT')"
            git pull --rebase -X ours origin main
            git push origin main
          fi
